[package]
name = "sageant-persistant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A durable sageant store on PersistAnt key-value backends."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["knowledge-base", "persistence", "sqlite", "key-value", "ai-agents"]
categories = ["database-implementations"]

[dependencies]
sageant = { path = "../..", version = "0.3.18" }
sageant-lexical = { path = "../sageant-lexical", version = "0.3.18" }
persistant = { version = "~0.18.15", features = ["registry-sqlite"] }

[dev-dependencies]
tempfile = "3"
