[package]
name = "sageant-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The sageant command line: a durable knowledge store you can use from a terminal or serve over MCP."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["knowledge-base", "memory", "cli", "mcp", "notes"]
categories = ["command-line-utilities"]

[[bin]]
name = "sageant"
path = "src/main.rs"
doc = false

[dependencies]
sageant = { path = "../..", version = "0.3.12" }
sageant-lexical = { path = "../sageant-lexical", version = "0.3.12" }
sageant-persistant = { path = "../sageant-persistant", version = "0.3.12" }
sageant-mcp = { path = "../sageant-mcp", version = "0.3.12" }
persistant = { version = "~0.18", features = ["registry-sqlite"] }
rmcp = { version = "3.10", default-features = false, features = ["server", "transport-io"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
