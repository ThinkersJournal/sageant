[package]
name = "sageant-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "An MCP server for the sageant knowledge store: injection-safe envelopes, write grants, no purge."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["mcp", "llm", "ai-agents", "memory", "knowledge-base"]
categories = ["development-tools", "network-programming"]

[dependencies]
sageant = { path = "../..", version = "0.3.19" }
sageant-lexical = { path = "../sageant-lexical", version = "0.3.19" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3.10", default-features = false, features = ["server", "transport-io"] }

[dev-dependencies]
sageant-persistant = { path = "../sageant-persistant", version = "0.3.19" }
persistant = { version = "~0.18.21", features = ["registry-sqlite"] }
rmcp = { version = "3.10", default-features = false, features = ["server", "client", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }
tempfile = "3"
