[workspace]
members = [".", "crates/*"]
resolver = "3"

# One version number for every crate in the project (CireSnave's standing rule); the PM allocates it.
[workspace.package]
version = "0.3.6"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/sageant"

[package]
name = "sageant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Planned. The crate name is reserved; there is no API yet."
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[dependencies]
redactant = { version = "0.1.2", optional = true }
unicode-normalization = { version = "0.1.26", optional = true, default-features = false }

[features]
redactant = ["dep:redactant"]
nfc = ["dep:unicode-normalization"]
