[package]
name = "sageant"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Planned. The crate name is reserved; there is no API yet."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/sageant"
readme = "README.md"
publish = false

[dependencies]
redactant = { version = "0.1.2", optional = true }
unicode-normalization = { version = "0.1.26", optional = true, default-features = false }

[features]
redactant = ["dep:redactant"]
nfc = ["dep:unicode-normalization"]
